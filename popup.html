<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #666666;
        --border: #d0d0d0;
        --accent: #3b82f6;
        --hover: rgb(0 0 0 / 7%);
      }
      :root[data-theme="dark"] {
        --bg: #1e1e1e;
        --fg: #f0f0f0;
        --muted: #a0a0a0;
        --border: #444444;
        --hover: rgb(255 255 255 / 9%);
      }
      body {
        font-family: system-ui, sans-serif;
        width: 240px;
        padding: 12px;
        background: var(--bg);
        color: var(--fg);
      }
      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        gap: 8px;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
        word-break: break-all;
      }
      .icon-btn {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        background: none;
        border: none;
        border-radius: 7px;
        font-size: 15px;
        line-height: 1;
        padding: 0;
        cursor: pointer;
        color: var(--fg);
        transition: background-color 0.15s ease;
      }
      .icon-btn:hover,
      .icon-btn:focus-visible {
        background: var(--hover);
      }
      .icon-btn:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 1px;
      }
      .value {
        font-size: 24px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 8px;
        cursor: text;
      }
      #value-edit[hidden] {
        display: none;
      }
      #value-edit {
        display: flex;
        justify-content: center;
        align-items: baseline;
        margin-bottom: 8px;
        font-size: 24px;
        font-weight: 700;
      }
      #value-input {
        font: inherit;
        font-size: inherit;
        font-weight: inherit;
        text-align: center;
        background: transparent;
        color: var(--fg);
        border: none;
        padding: 0;
        -moz-appearance: textfield;
        appearance: textfield;
      }
      #value-input::-webkit-outer-spin-button,
      #value-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      #value-input:focus {
        outline: none;
      }
      input[type="range"] {
        width: 100%;
      }
      .disabled-message {
        font-size: 12px;
        color: var(--muted);
      }
      fieldset.theme-options {
        border: none;
        padding: 0;
        margin: 0;
      }
      fieldset.theme-options legend {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        padding: 0 0 6px;
      }
      fieldset.theme-options label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        padding: 7px 8px;
        margin: 0 -8px;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      fieldset.theme-options label:hover {
        background: var(--hover);
      }
      fieldset.theme-options label:has(input:checked) {
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      fieldset.theme-options input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        flex: none;
        width: 16px;
        height: 16px;
        margin: 0;
        border: 2px solid var(--border);
        border-radius: 50%;
        display: grid;
        place-content: center;
        cursor: pointer;
        transition: border-color 0.15s ease;
      }
      fieldset.theme-options input[type="radio"]::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        transform: scale(0);
        transition: transform 0.15s ease;
      }
      fieldset.theme-options input[type="radio"]:checked {
        border-color: var(--accent);
      }
      fieldset.theme-options input[type="radio"]:checked::before {
        transform: scale(1);
      }
      fieldset.theme-options input[type="radio"]:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="main-view">
      <div class="header-row">
        <h1 id="hostname">—</h1>
        <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
      </div>
      <div class="value" id="value" title="Click to type an exact value">100%</div>
      <span id="value-edit" hidden><input type="number" id="value-input" min="0" max="500" step="1" />%</span>
      <input type="range" id="slider" min="0" max="500" step="5" value="100" />
      <div class="disabled-message" id="disabled-message" hidden>
        Volume Conductor isn't available on this page.
      </div>
    </div>
    <div id="settings-view" hidden>
      <div class="header-row">
        <button id="back-btn" class="icon-btn" title="Back" aria-label="Back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <h1>Settings</h1>
      </div>
      <fieldset class="theme-options">
        <legend>Theme</legend>
        <label><input type="radio" name="theme" value="light" /> Light</label>
        <label><input type="radio" name="theme" value="dark" /> Dark</label>
        <label><input type="radio" name="theme" value="auto" /> Auto (system)</label>
      </fieldset>
    </div>
    <script src="volume-store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
